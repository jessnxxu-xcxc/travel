<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFCF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: 旅遊手帳。點點方格紙底、紙膠帶標題、印章日期、貼紙標籤；一頁到底：行程 → 記帳 → 清單 */
:root{
  --bg:#F7F4EF; --surface:#FFFFFF; --sunk:#F2EDE6; --dot:#E3DCD2;
  --ink:#26232E; --muted:#6E6877; --line:#E5DDD3; --line-strong:#CEC3B6;
  --sakura:#D6456D; --sakura-soft:#FBE8ED; --ai:#34508F; --ai-soft:#E8EDF6;
  --k-food:#C23D63; --k-spot:#34508F; --k-shop:#6A4C9C; --k-move:#5E6472; --k-stay:#2F7A6B; --k-todo:#946016;
  --kb-food:#FBE8ED; --kb-spot:#E8EDF6; --kb-shop:#EFEAF7; --kb-move:#EEEFF2; --kb-stay:#E3F1EC; --kb-todo:#F7EEDD;
  --tape-pink:rgba(214,69,109,.2); --tape-blue:rgba(52,80,143,.16); --tape-mint:rgba(196,150,70,.22); --tape-yellow:rgba(196,150,70,.22); --hl:rgba(214,69,109,.16);
  --ok:#2F7A6B; --warn:#946016; --warn-soft:#F7EEDD;
  --paper-shadow:0 1px 0 rgba(90,70,50,.05),0 8px 18px -12px rgba(70,50,30,.28);
  --scrim:rgba(38,35,46,.42); --shadow:0 12px 32px rgba(40,30,25,.18);
  color-scheme:light;
  --page-w:912px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb{white-space:nowrap}
.wrapc{max-width:var(--page-w);margin:0 auto}

/* hero */
.hero{padding-block:20px 12px;display:grid;gap:12px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:0 8px;min-width:0;flex-wrap:wrap}
.brand h1{margin:0;font-size:32px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.brand h1 em{font-style:normal;color:var(--sakura)}
.brand .sub{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.sync[data-s="live"] i{background:var(--ok)}
.sync[data-s="ro"] i{background:var(--warn)}
.sync[data-s="off"] i{background:var(--sakura)}
.pass{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 112px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 2px 10px rgba(23,32,58,.06)}
.pass::before,.pass::after{content:"";position:absolute;right:104px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass::before{top:-9px;clip-path:inset(50% 0 0 0)}
.pass::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.pass-main{padding:18px 20px;display:grid;gap:14px;min-width:0}
.fly-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.ap{display:grid;gap:2px}
.ap.r{text-align:right}
.ap b{font-size:32px;font-weight:900;line-height:1;letter-spacing:.02em}
.ap span{font-size:12px;color:var(--muted);white-space:nowrap}
.fly{display:grid;justify-items:center;gap:4px;min-width:0}
.fn{font-size:12px;font-weight:700;color:var(--sakura);white-space:nowrap}
.ft{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fline{position:relative;width:100%;height:20px;display:grid;place-items:center;color:var(--sakura)}
.fline::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line-strong)}
.fline svg{position:relative;width:20px;height:20px;transform:rotate(90deg);background:var(--surface);padding:0 2px}
.pass-meta{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.pass-meta div{display:grid;gap:1px;min-width:0}
.pass-meta span{font-size:12px;color:var(--muted)}
.pass-meta b{font-size:14px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.pass-meta small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pass-stub{border-left:2px dashed var(--line);display:grid;place-content:center;justify-items:center;text-align:center;gap:2px;padding:12px 8px;background:var(--sakura-soft);border-radius:0 19px 19px 0}
.pass-stub span{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.pass-stub b{font-size:36px;font-weight:900;line-height:1.05;color:var(--sakura);font-variant-numeric:tabular-nums;white-space:nowrap}
.pass-stub b.sm{font-size:24px}
@media (max-width:520px){.pass-meta{display:none}.pass-main{padding-block:16px!important}.fly .ft{white-space:normal;text-align:center;max-width:9em}.pass{grid-template-columns:minmax(0,1fr) 88px}.pass::before,.pass::after{right:80px}.pass-main{padding:14px}.ap b{font-size:26px}.pass-meta{grid-template-columns:1fr}.pass-stub b{font-size:30px}.pass-stub b.sm{font-size:20px}}
@media (min-width:760px){.brand h1{font-size:40px}}

/* sticky bar */
.bar-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px 0}
.tabs{display:flex;gap:18px;padding:0 2px}
.tabs button{border:0;background:transparent;border-bottom:3px solid transparent;border-radius:0;padding:6px 2px;font-size:16px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--sakura)}
.bar .sp{flex:1}
.peers{display:flex;align-items:center}
.peer{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;border:2px solid var(--bg);margin-left:-6px;position:relative}
.peer:first-child{margin-left:0}
.peers-l{font-size:12px;color:var(--muted);margin-right:6px;white-space:nowrap}
@media (max-width:400px){.peers-l{display:none}.tabs button{padding:6px 12px}}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.icon-btn svg{width:18px;height:18px}
.strip{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.c-month{flex:0 0 auto;align-self:center;font-size:12px;font-weight:700;color:var(--muted);writing-mode:vertical-rl;letter-spacing:.1em;padding-right:2px}
.chip{position:relative;flex:0 0 auto;display:grid;justify-items:center;gap:2px;min-width:44px;padding:2px 0;border:0;background:transparent;font-variant-numeric:tabular-nums}
.chip .c-w{font-size:12px;color:var(--muted);line-height:1.4;white-space:nowrap}
.chip.wkend .c-w{color:var(--sakura)}
.chip .c-d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;border:2px solid transparent;transition:background .15s,border-color .15s,color .15s}
.chip:hover .c-d{background:var(--sunk)}
.chip.today .c-d{border-color:var(--sakura);color:var(--sakura)}
.chip.active .c-d{background:var(--sakura);border-color:var(--sakura);color:#fff}
.chip .c-dots{display:flex;gap:2px;height:6px;align-items:center}
.chip .c-dots i{width:4px;height:4px;border-radius:50%;background:var(--sakura);opacity:.75}
.chip.pool .c-d{border:2px dashed var(--line-strong);font-size:14px;color:var(--muted)}
.chip.pool.active .c-d{border-style:solid}
.chip.drop .c-d{background:var(--sakura);border-color:var(--sakura);color:#fff;transform:scale(1.1)}
.chip .pdots{position:absolute;top:14px;right:0;display:flex;gap:2px}
.chip .pdots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--bg)}
.strip-gap{height:8px}

/* now card */
.nowc{padding-block:24px 0}
.nowcard{border:1px solid var(--sakura);background:var(--surface);border-radius:20px;box-shadow:0 6px 20px rgba(214,69,109,.1);padding:18px 20px;display:grid;gap:12px}
.nowcard .nl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--sakura);letter-spacing:.04em}
.nowcard .nl i{width:8px;height:8px;border-radius:50%;background:var(--sakura);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.nowmain{display:flex;align-items:center;gap:12px}
.nowmain .nt{flex:1;min-width:0;display:grid;gap:2px}
.nowmain .nt b{font-size:20px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.nowmain .nt span{font-size:12px;color:var(--muted)}
.nowmain .nt .nd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nownext{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;word-break:keep-all;overflow-wrap:anywhere}
.nownext b{color:var(--ink);font-weight:700}

/* board */
.board{padding-block:24px 128px}
.col{display:none;min-width:0}
.col.active{display:block}
.col-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.col-date{display:grid;justify-items:center;min-width:60px;padding:8px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-variant-numeric:tabular-nums}
.col-date b{font-size:22px;line-height:1.1;font-weight:900}
.col-date span{font-size:12px;color:var(--muted);font-weight:500}
.col-date.wkend span{color:var(--sakura)}
.col-t{display:grid;gap:2px;min-width:0;flex:1}
.col-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px}
.col-n{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.col-n em{font-style:normal;color:var(--sakura)}
.col-title{all:unset;cursor:pointer;font-size:22px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;border-bottom:1px dashed transparent}
.col-title:hover{border-bottom-color:var(--line-strong)}
.col-title:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.col-title.ph-title{color:var(--muted);font-weight:500}
.route{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--ai);color:var(--ai);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.route svg{width:14px;height:14px}
.route:hover{background:var(--ai-soft)}
.col-foot{margin-top:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pool-desc{font-size:12px;color:var(--muted)}

.tl{display:grid}
.slot{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.tl .slot:first-child{border-top:0;padding-top:4px}
.slot-h{display:flex;align-items:center;gap:8px;min-height:32px}
.sico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);flex:0 0 auto}
.sico svg{width:14px;height:14px}
.slot-h b{font-size:14px;font-weight:700}
.slot.cur .sico{background:var(--sakura);border-color:var(--sakura);color:#fff}
.slot.cur .slot-h b{color:var(--sakura)}
.slot.is-empty{padding-block:10px;gap:0}
.slot.is-empty .slot-h b,.slot.is-empty .sico{opacity:.6}
.slot.is-empty .list{min-height:0}
.slot.is-empty .empty{display:none}
body.dragging .slot.is-empty{gap:10px}
body.dragging .slot.is-empty .empty{display:flex}
.slot-sum{font-size:12px;color:var(--muted)}
.slot-add{all:unset;cursor:pointer;margin-left:auto;height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;color:var(--muted);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface)}
.slot-add:hover{border-color:var(--ink);color:var(--ink)}
.slot-add:focus-visible{outline:2px solid var(--ai)}
.slot.pool-slot{border-top:0}
.slot.pool-slot.is-empty .empty{display:flex}
.list{display:grid;gap:12px;min-height:36px;align-content:start}
.empty{display:flex;align-items:center;min-height:36px;padding:0 12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px}
.list:has(.ph) .empty{display:none}
body.dragging .list .empty{border-color:var(--line-strong)}

.item{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:60px;box-shadow:0 1px 2px rgba(23,32,58,.05);transition:border-color .15s,box-shadow .15s,transform .15s}
.item:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(23,32,58,.08)}
.item.src{position:absolute;visibility:hidden;pointer-events:none;height:0;min-height:0;overflow:hidden;border:0}
.grip{all:unset;cursor:grab;display:grid;place-items:center;color:var(--line-strong);touch-action:none;border-radius:16px 0 0 16px}
.grip:hover{color:var(--muted)}
.grip:focus-visible{outline:2px solid var(--ai)}
.ro .grip{cursor:default;visibility:hidden}
.ibody{cursor:pointer;display:grid;gap:4px;padding:14px 4px 14px 2px;min-width:0;outline:none}
.ibody:focus-visible{outline:2px solid var(--ai);border-radius:6px}
.imeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted);line-height:1.5}
.mapl{display:inline-flex;align-items:center;gap:2px;padding:1px 8px 1px 6px;border-radius:999px;background:var(--ai-soft);color:var(--ai);font-weight:700;text-decoration:none;white-space:nowrap}
.mapl svg{width:12px;height:12px}
.mapl:hover{text-decoration:underline}
.itime{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.kind{font-size:12px;font-weight:700;padding:0 6px;border-radius:6px;border:1px solid currentColor;line-height:18px;white-space:nowrap}
.k-food{color:var(--k-food)}.k-spot{color:var(--k-spot)}.k-shop{color:var(--k-shop)}.k-move{color:var(--k-move)}.k-stay{color:var(--k-stay)}.k-todo{color:var(--k-todo)}
.ititle{font-size:18px;font-weight:700;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.idesc{font-size:14px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inote{font-size:12px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.iwarn{font-size:12px;color:var(--warn);font-weight:500}
.ithumbs{display:flex;gap:6px;margin-top:4px}
.ithumbs img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--sunk)}
.ithumbs span{font-size:12px;color:var(--muted);align-self:center}
.iacts{display:flex;align-items:flex-start;gap:4px;padding:14px 12px 14px 4px}
.ibtn{all:unset;cursor:pointer;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;background:var(--surface)}
.ibtn:hover{border-color:var(--line-strong);color:var(--ink)}
.ibtn:focus-visible{outline:2px solid var(--ai)}
.ibtn.map{width:auto;padding:0 8px;gap:2px;grid-auto-flow:column;color:var(--ai);border-color:var(--ai-soft);background:var(--ai-soft)}
.ibtn.map svg{width:14px;height:14px}
.item.done{background:var(--sunk)}
.item.done .ititle{text-decoration:line-through;color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--sakura)}100%{box-shadow:0 0 0 0 transparent}}

.ph{border:2px dashed var(--sakura);border-radius:12px;background:var(--sakura-soft)}
.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:var(--shadow);border-color:var(--sakura);transform:rotate(1.5deg) scale(1.02);opacity:.96;margin:0}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

.notice{padding-block:12px 0}
.notice div{border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.notice b{display:block;margin-bottom:2px}

.layout{max-width:var(--page-w);margin:0 auto;padding-inline:0}
.layout.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mainc{min-width:0}
.mbar{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;box-shadow:var(--paper-shadow)}
.mbar span{overflow:hidden;text-overflow:ellipsis}
.mbar b{color:var(--sakura);font-variant-numeric:tabular-nums}
.mbar small{font-size:12px;font-weight:500;color:var(--muted)}
.mbar:hover{border-color:var(--sakura)}
.dsec{display:grid;gap:10px;padding-block:14px;border-top:1px dashed var(--line-strong)}
.dsec-h{display:flex;align-items:center;gap:8px;min-height:32px;flex-wrap:wrap}
.dsec-h b{font-size:14px;font-weight:700;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 4px}
.dsec-h small{font-size:12px;color:var(--muted)}
.dsum{font-size:14px;font-weight:700;color:var(--sakura);font-variant-numeric:tabular-nums}
.dsec .slot-add{margin-left:auto}
.drows{display:grid;gap:8px}
.dsec .clist{gap:8px}
.dsec .addrow .inp{padding:8px 12px;font-size:14px}
.dsec .addrow .btn{padding:8px 14px;font-size:14px}
.ltype{font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;line-height:20px;white-space:nowrap;justify-self:start}
/* lists tab */
.board{padding-bottom:32px!important}
.below{display:grid;gap:40px;padding-block:8px 128px}
.sec{display:grid;gap:16px;min-width:0;scroll-margin-top:var(--barh,140px)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:24px;border-top:2px dashed var(--line-strong)}
.sec-h h2{margin:0;font-size:24px;font-weight:900}
.lgrid{display:grid;gap:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;min-width:0}
.lcard-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lcard-h b{font-size:18px;font-weight:700}
.lcard-h small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lcard .crow{box-shadow:none}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}

.catleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.catleg span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.catleg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.spent{font-size:12px;font-weight:700;color:var(--sakura);white-space:nowrap;font-variant-numeric:tabular-nums}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px}
.amt-hint{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

.eamt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.eamt small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.eday{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* FAB / sheet / toast */
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:40;display:flex;align-items:center;gap:6px;height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--sakura);color:#fff;font-size:16px;font-weight:700;box-shadow:var(--shadow)}

.sheet{width:100%;max-width:560px;max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;border:1px solid var(--line)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.seg.days button{min-width:52px;font-variant-numeric:tabular-nums;padding:4px 6px;font-size:12px;line-height:1.3}
.seg.days button b{display:block;font-size:14px}
.btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btns .sp{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700;white-space:nowrap}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.pri{background:var(--sakura);border-color:var(--sakura);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--sakura);border-color:var(--sakura)}
.btn.ai{color:var(--ai);border-color:var(--ai)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph-t{position:relative;width:76px;height:76px}

.ph-t button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;display:grid;place-items:center;padding:0}
.ph-t button.arm{background:var(--sakura);border-color:var(--sakura);color:#fff;width:auto;padding:0 8px;border-radius:12px}
.ph-add{width:76px;height:76px;border-radius:10px;border:1px dashed var(--line-strong);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;line-height:1.3;background:var(--surface)}
.ph-add input{display:none}
.ph-busy{width:76px;height:76px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.preview{display:grid;gap:6px}
.pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.pv b{color:var(--ink);font-size:14px;margin-right:4px;word-break:keep-all;overflow-wrap:anywhere}
.pv .tag{border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.sres{display:grid;gap:6px;max-height:60vh;overflow:auto}
.sres button{all:unset;cursor:pointer;display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sres button:hover,.sres button:focus-visible{border-color:var(--ink)}
.sres b{font-size:14px;word-break:keep-all;overflow-wrap:anywhere}
.sres span{font-size:12px;color:var(--muted)}
.sres mark{background:var(--sakura-soft);color:inherit;border-radius:2px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:80;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow)}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ro #exp-add,.ro [data-exp-day],.ro [data-todo-day],.ro .cam,.ro .now-done,.ro #e-exp,.ro .fab,.ro .slot-add,.ro .addrow,.ro .expform,.ro .pchip button,.ro .people .btn{display:none}

/* ---- journal layer ---- */
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:22px 22px;background-attachment:fixed}
.bar-wrap{background:var(--bg);border-bottom:1px solid var(--line)}
.tape{position:relative;display:inline-block;padding:2px 12px;font-weight:700;color:var(--ink);background:var(--tape-pink);transform:rotate(-2deg);clip-path:polygon(0 12%,3% 0,97% 4%,100% 14%,98% 50%,100% 86%,97% 100%,3% 96%,0 88%,2% 50%)}
.tape.blue{background:var(--tape-blue)}.tape.mint{background:var(--tape-mint)}.tape.yellow{background:var(--tape-yellow)}
.pass,.item,.lcard,.sumcard,.nowcard,.crow,.erow,.agg,.col-date,.icon-btn{box-shadow:var(--paper-shadow)}

.pass-main::before{content:"";position:absolute;top:-12px;left:22px;width:84px;height:22px;background:var(--tape-blue);transform:rotate(-5deg);clip-path:polygon(0 12%,4% 0,96% 4%,100% 14%,98% 50%,100% 86%,96% 100%,4% 96%,0 88%,2% 50%)}
.pass-stub{background:var(--sakura-soft);background-image:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,255,255,.25) 10px 12px)}
.col-n{justify-self:start;display:inline-block;padding:1px 12px;background:var(--tape-pink);color:var(--ink)!important;transform:rotate(-2deg);clip-path:polygon(0 12%,3% 0,97% 4%,100% 14%,98% 50%,100% 86%,97% 100%,3% 96%,0 88%,2% 50%)}
.col-n em{color:var(--sakura)}
.col-date{width:72px;height:72px;min-width:72px;padding:0;border-radius:50%;border:2px dashed var(--sakura);background:var(--surface);color:var(--sakura);display:grid;place-content:center;transform:rotate(-6deg)}
.col-date b{font-size:20px;color:var(--sakura)}
.col-date span{color:var(--sakura)!important;font-size:12px}
.slot-h b{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 4px}
.slot.cur .slot-h b{color:var(--ink)}
.sico{border-style:dashed}
.slot{border-top-style:dashed}
.kind{border:0;padding:1px 8px;border-radius:999px;line-height:20px}
.kind.k-food{background:var(--kb-food)}.kind.k-spot{background:var(--kb-spot)}.kind.k-shop{background:var(--kb-shop)}.kind.k-move{background:var(--kb-move)}.kind.k-stay{background:var(--kb-stay)}.kind.k-todo{background:var(--kb-todo)}
.item{background:var(--surface);border-color:var(--line);border-radius:14px}
.mapl{background:transparent;color:var(--muted);border:1px solid var(--line-strong);padding:0 8px 0 6px}
.mapl:hover{color:var(--ai);border-color:var(--ai);text-decoration:none}
.item.done{background:var(--sunk)}
.ithumbs{gap:10px;margin-top:8px;padding-left:2px}
.ithumbs img{width:64px;height:64px;border-radius:3px;border:4px solid #fff;box-shadow:0 2px 6px rgba(60,40,20,.25);transform:rotate(-3deg);cursor:zoom-in}
.ithumbs img:nth-child(2){transform:rotate(2deg)}.ithumbs img:nth-child(3){transform:rotate(-1deg)}
.iacts{flex-direction:column;align-items:center;gap:8px}
.ibtn.cam svg{width:16px;height:16px}
.nowcard{border-style:dashed;border-width:2px}
.nowcard .nl{justify-self:start}
.sec-h{border-top:2px dashed var(--line-strong)}
.sec-h h2{font-size:22px;padding:2px 14px;background:var(--tape-yellow);transform:rotate(-1.5deg);clip-path:polygon(0 12%,3% 0,97% 4%,100% 14%,98% 50%,100% 86%,97% 100%,3% 96%,0 88%,2% 50%)}
.lcard{position:relative;padding-top:22px}
.lcard::before{content:"";position:absolute;top:-10px;left:50%;width:76px;height:20px;margin-left:-38px;background:var(--tape-mint);transform:rotate(3deg)}
.lcard:nth-child(2)::before{background:var(--tape-pink);transform:rotate(-3deg)}

.chip .c-d{border-style:dashed}
.chip.active .c-d{border-style:solid}
.fab{box-shadow:0 10px 24px -10px rgba(214,69,109,.55)}
/* sheets as journal pages */

.sheet h2{justify-self:start;padding:2px 14px;background:var(--tape-pink);transform:rotate(-1.5deg);clip-path:polygon(0 12%,3% 0,97% 4%,100% 14%,98% 50%,100% 86%,97% 100%,3% 96%,0 88%,2% 50%);margin-right:48px}
.sheet:not(:has(.foot)){padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted);z-index:2}
.sheet-x:hover{color:var(--ink);border-color:var(--ink)}

.sheet .foot{position:sticky;bottom:0;z-index:3;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px dashed var(--line-strong)}

.btn.block{width:100%;justify-content:center;display:flex}
.map-big{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ai);border-color:var(--ai);background:var(--surface);font-size:14px}
.map-big svg{width:16px;height:16px}
.more{border:1px dashed var(--line-strong);border-radius:12px;padding:0 14px;background:var(--surface)}
.more>summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:700;color:var(--muted);list-style:none}

.seg button{border-radius:999px;padding:6px 14px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--sakura-soft);border-color:var(--sakura);color:var(--sakura);font-weight:700}
.dstrip{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.dstrip::-webkit-scrollbar{display:none}
.dstrip button{flex:0 0 auto;display:grid;justify-items:center;gap:2px;min-width:44px;padding:0;border:0;background:transparent!important;color:var(--ink)!important;border-radius:0}

.hint2{font-size:12px;color:var(--muted);line-height:1.6}
textarea.grow{min-height:52px;resize:none;overflow:hidden;font-size:18px;line-height:1.5}
.pvc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--paper-shadow)}

/* ---- ux layer ---- */
@media (min-width:960px){.fab{right:max(16px,calc((100vw - var(--page-w)) / 2 + 16px))}}
.tl .slot.is-empty{display:none}

.empty-day{border:2px dashed var(--line-strong);border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface)}

.item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.acts{display:grid;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.abtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;font-size:16px;font-weight:500;color:var(--ink);border-top:1px solid var(--line)}

.abtn:hover,.abtn:focus-visible{background:var(--sunk)}

/* ===== 日系繪本風（和紙白底、3px 墨灰粗線、大圓角、平塗四色、Huninn） ===== */
:root{
  --bg:#FFFCF6; --surface:#FFFFFF; --sunk:#FBF3E6; --dot:transparent;
  --ink:#3E3A39; --muted:#77706D; --line:#3E3A39; --line-strong:#3E3A39;
  --coral:#F2A497; --yellow:#F6D27A; --water:#A8D3E6; --green:#B9DAA5;
  --sakura:#D9705C; --sakura-soft:#FDE7E0; --ai:#3E3A39; --ai-soft:#E4F2F8;
  --k-food:#3E3A39; --k-spot:#3E3A39; --k-shop:#3E3A39; --k-move:#3E3A39; --k-stay:#3E3A39; --k-todo:#3E3A39;
  --kb-food:#F2A497; --kb-spot:#A8D3E6; --kb-shop:#F6D27A; --kb-move:#B9DAA5; --kb-stay:#B9DAA5; --kb-todo:#F6D27A;
  --tape-pink:#F2A497; --tape-blue:#A8D3E6; --tape-mint:#B9DAA5; --tape-yellow:#F6D27A; --hl:rgba(246,210,122,.75);
  --ok:#5E9A4A; --warn:#B07A10; --warn-soft:#FCF0D2;
  --paper-shadow:none; --shadow:0 12px 0 -6px rgba(62,58,57,.18);
  --font:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --bw:3px; --r:22px;
}
body{background:var(--bg)!important;background-image:none!important}
.bar-wrap{border-bottom:var(--bw) solid var(--ink)}
h1,h2,b,.ititle,.ct{font-weight:400!important}
.brand h1{font-size:34px;letter-spacing:.02em}
.brand h1 em{color:var(--sakura)}
.hero-art{display:flex;justify-content:center;margin:-4px 0 -6px}
.hero-svg{width:100%;max-width:420px;height:auto;display:block}
@media (prefers-reduced-motion:no-preference){
  .a-cloud1{animation:drift 9s ease-in-out infinite alternate}.a-cloud2{animation:drift 7s ease-in-out infinite alternate-reverse}
  .a-plane{animation:bob 3.2s ease-in-out infinite}.a-sun{animation:glow 4s ease-in-out infinite;transform-origin:300px 38px}
  .a-petal{animation:fall 6s ease-in-out infinite alternate}
}
@keyframes drift{to{transform:translateX(14px)}}
@keyframes bob{50%{transform:translate(6px,-5px) rotate(-2deg)}}
@keyframes glow{50%{transform:scale(1.08)}}
@keyframes fall{to{transform:translateY(6px) rotate(8deg)}}

/* cards & frames */
.pass,.item,.nowcard,.erow,.crow,.agg,.sumcard,.lcard,.empty-day,.mbar,.icon-btn,.sheet,.acts,.pvc,.more,.fact{border:var(--bw) solid var(--ink)!important;border-radius:var(--r)!important;box-shadow:none!important}
.item,.erow,.crow{border-radius:18px!important}
.item.done{background:var(--sunk)}
.pass::before,.pass::after{border:var(--bw) solid var(--ink);right:104px}
.pass-main::before,.lcard::before{display:none}
.pass-stub{background:var(--yellow)!important;background-image:none!important;border-left:var(--bw) dashed var(--ink)!important;border-radius:0 19px 19px 0}
.pass-stub b{color:var(--ink)!important}
.fline::before{border-top:3px dashed var(--ink)}
.fline svg{color:var(--sakura)}

.nowcard{background:var(--sakura-soft)!important;border-style:solid!important}

/* day header */
.col-date{width:76px;height:76px;min-width:76px;border:var(--bw) solid var(--ink)!important;background:var(--coral)!important;color:var(--ink)!important;transform:rotate(-4deg)}

.sico{border:2px solid var(--ink)!important;background:var(--water)!important;color:var(--ink)!important}

/* chips / stickers */
.kind{border:2px solid var(--ink)!important;color:var(--ink)!important;line-height:18px}

/* buttons */
.btn{border:var(--bw) solid var(--ink)!important;border-radius:999px!important;color:var(--ink)}

.sheet{background:var(--bg)!important;background-image:none!important}

/* ---------- now / next ---------- */
function renderNow(){const box=$('#now'),n=todayN();
  if(n<1||n>NDAYS||S.active!==n){box.hidden=true;return}
  const t=now(),mins=t.getHours()*60+t.getMinutes(),cur=curSlot();
  const toMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
  const list=dayItems(n).filter(i=>!i.done);
  const ups=list.filter(i=>{const tm=toMin(i.time);return tm!=null?tm>=mins-60:SLOT_I[i.slot]>=cur});
  const nx=ups[0],after=ups[1];
  let h='<div class="nowcard"><div class="nl"><i></i>現在・'+SLOTS[cur].l+'時段</div>';
  if(!nx)h+='<div class="nowmain"><div class="nt"><b>今天的行程都完成了</b><span>好好休息，明天見</span></div></div>';
  else h+='<div class="nowmain" data-id="'+esc(nx.id)+'"><div class="nt"><span>下一站'+(nx.time?'・'+esc(nx.time):'・'+SLOT_L[nx.slot])+(nx.area?'・'+esc(nx.area):'')+'</span><b>'+esc(nx.title)+'</b>'+(nx.desc?'<span class="nd">'+esc(nx.desc)+'</span>':'')+'</div>'+
    (PLACE_KINDS.includes(nx.kind)||safeUrl(nx.map)?'<a class="ibtn map" href="'+esc(mapUrl(nx))+'" target="_blank" rel="noopener">'+PIN+'導航</a>':'')+
    '<button type="button" class="ibtn chk now-done" data-id="'+esc(nx.id)+'" aria-label="完成，前往下一站">✓</button></div>'+
    (after?'<div class="nownext">接著：<b>'+esc(after.title)+'</b>'+(after.area?'・'+esc(after.area):'')+'</div>':'');
  box.innerHTML=h+'</div>';box.hidden=false}

let presT=0;
function pushPresence(){if(!S.room)return;clearTimeout(presT);presT=setTimeout(()=>{S.room.presence({tab:S.tab||'plan',day:S.active}).catch(()=>{})},250)}
async function onPeersChange(ch){const seen=new Map();
  for(const p of ch.peers){if(p.isMe||p.kind!=='viewer')continue;const key=p.by||p.peer;if(!seen.has(key)||(p.updatedAt>(seen.get(key).updatedAt||0)))seen.set(key,p)}
  const ids=[...seen.values()].map(p=>p.by).filter(Boolean);
  if(ids.length&&S.user){try{const pr=await S.user.profiles(ids);Object.assign(S.prof,pr)}catch(e){}}
  const pal=['#D93A6E','#1F56B0','#7445C2','#0B7F72','#A0640C'];
  S.peers=[...seen.values()].map((p,i)=>{const pr=p.by&&S.prof[p.by];return{name:(pr&&pr.name)||'旅伴',color:(pr&&pr.color)||pal[i%pal.length],presence:p.presence||{},updatedAt:p.updatedAt}});
  renderPeers();if(!S.drag)renderStrip()}

function listRows(type){return [...S.lists.values()].filter(r=>r.type===type).sort((a,b)=>(a.done-b.done)||(lkey(a)-lkey(b))||a.id.localeCompare(b.id))}
function checkHTML(type){const t=LTYPES.find(x=>x.k===type),rows=listRows(type),done=rows.filter(r=>r.done).length;
  let h='<form class="addrow" data-type="'+type+'"><input class="inp" id="add-'+type+'" aria-label="新增到'+t.l+'" placeholder="'+esc(t.ph)+'" autocomplete="off"><button class="btn pri" type="submit">加入</button></form>';

    '<button type="button" class="cbody lbody"><span class="ct">'+esc(r.title)+'</span>'+(r.note?'<span class="cn">'+esc(r.note)+'</span>':'')+thumbs(r.photos)+'</button>'+
    (r.day?'<span class="cday">D'+r.day+' '+md(dayDate(r.day))+'</span>':'<span></span>')+'</li>').join('')+'</ul>'
   :'<div class="empty">'+esc(t.empty)+'</div>';
  return h}
function people(){const set=[...S.meta.people];for(const e of S.exps.values())if(e.payer&&!set.includes(e.payer))set.push(e.payer);return set}
function spentOn(it){let s=0;for(const e of S.exps.values())if(e.itemId===it.id)s+=+e.amount||0;return s}
function money(){const ps=people(),ex=[...S.exps.values()];const paid={},spent={};ps.forEach(p=>{paid[p]=0;spent[p]=0});let total=0;
  for(const e of ex){const a=+e.amount||0;total+=a;if(e.payer)paid[e.payer]+=a;
    const cons=e.split==='self'?(e.payer?[e.payer]:[]):(S.meta.people.length?S.meta.people:(e.payer?[e.payer]:[]));
    cons.forEach(p=>spent[p]=(spent[p]||0)+a/cons.length)}
  const all=[...new Set([...ps,...Object.keys(spent)])];
  const bal=all.map(p=>({p,b:(paid[p]||0)-(spent[p]||0)}));
  const cr=bal.filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b),dr=bal.filter(x=>x.b<-0.5).sort((a,b)=>a.b-b.b);const tx=[];
  let i=0,j=0;while(i<dr.length&&j<cr.length){const amt=Math.min(-dr[i].b,cr[j].b);tx.push({from:dr[i].p,to:cr[j].p,amt});dr[i].b+=amt;cr[j].b-=amt;if(-dr[i].b<0.5)i++;if(cr[j].b<0.5)j++}
  return{ps:all,total,paid,spent,tx,ex}}
function eRow(e,rate){const meta=[e.what&&e.shop?e.what:'',CAT_L[e.cat]||'',e.split==='self'&&e.payer?e.payer+' 個人':'💰旅遊基金',PAY_L[e.pay]||'',e.cur==='TWD'&&e.orig?'台幣 NT$'+(+e.orig).toLocaleString():'',(e.photos||[]).length?'📎 收據':''].filter(Boolean).join('・');
  return '<div class="erow" data-eid="'+esc(e.id)+'"><button type="button" class="cbody ebody"><span class="ct">'+esc(e.shop||e.what||'（未填）')+'</span>'+(meta?'<span class="cn">'+esc(meta)+'</span>':'')+'</button><div class="eamt">'+(e.cur==='TWD'&&+e.orig>0?ntd(+e.orig)+'<small>≈ '+yen(+e.amount||0)+'</small>':ntd((+e.amount||0)*rate)+'<small>≈ '+yen(+e.amount||0)+'</small>')+'</div></div>'}
function aggHTML(groups,rate,max){return groups.map(g=>'<details class="agg"><summary><span class="cbody"><span class="ct">'+esc(g.label)+'</span><span class="cn">'+esc(g.sub)+'</span>'+(max?'<span class="abar"><i style="width:'+(g.sum/max*100).toFixed(1)+'%;--bc:'+(CAT_C[g.k]||'var(--sakura)')+'"></i></span>':'')+'</span><span class="eamt">'+ntd(g.sum*rate)+'<small>≈ '+yen(g.sum)+'</small></span></summary><div class="rows">'+g.rows.map(e=>eRow(e,rate)).join('')+'</div></details>').join('')}
function renderMoney(){const el=$('#money'),m=money(),rate=+S.meta.rate||0,tn=todayN();
  const openKeys=[...el.querySelectorAll('details[open]')].map(d=>d.dataset.k);const hadAny=!!el.querySelector('details.agg');

    budgetHTML(m.total,rate)+'<div class="stats"><div><span>'+(todaySum!=null?'今天':'筆數')+'</span><b>'+(todaySum!=null?ntd(todaySum*rate):m.ex.length+' 筆')+'</b></div><div><span>平均每天</span><b>'+ntd((dayKeys.length?(m.total-(byDay[0]||0))/dayKeys.length:0)*rate)+'</b></div><div><span>花最多的一天</span><b>'+(topDay?md(dayDate(+topDay))+' '+ntd(byDay[topDay]*rate):'—')+'</b></div></div>';
  if(m.total){const bc={};m.ex.forEach(e=>{const c=CAT_L[e.cat]?e.cat:'other';bc[c]=(bc[c]||0)+(+e.amount||0)});const cs=CATS.map(c=>c[0]).filter(c=>bc[c]);
    h+='<div class="catbar" role="img" aria-label="各分類花費比例">'+cs.map(c=>'<i style="width:'+(bc[c]/m.total*100).toFixed(2)+'%;background:'+CAT_C[c]+'"></i>').join('')+'</div><div class="catleg">'+cs.map(c=>'<span><i style="background:'+CAT_C[c]+'"></i>'+CAT_L[c]+' '+Math.round(bc[c]/m.total*100)+'%</span>').join('')+'</div>'}
  {const own={};let fund=0;m.ex.forEach(e=>{const a=+e.amount||0;if(e.split==='self'&&e.payer)own[e.payer]=(own[e.payer]||0)+a;else fund+=a});
    if(m.total)h+='<div class="paid"><div><span>💰旅遊基金</span><b>'+ntd(fund*rate)+'</b><i>≈ '+yen(fund)+'</i></div>'+Object.keys(own).map(p=>'<div><span>'+esc(p)+' 個人</span><b>'+ntd(own[p]*rate)+'</b><i>≈ '+yen(own[p])+'</i></div>').join('')+'</div>'}
  h+='<div class="people"><span class="sec-l">個人購物的人</span>'+S.meta.people.map(p=>'<span class="pchip">'+esc(p)+'<button type="button" data-rm-person="'+esc(p)+'" aria-label="移除 '+esc(p)+'">×</button></span>').join('')+'<button type="button" class="btn sm" id="add-person">＋ 成員</button></div></div>';
  const V=[['day','依日期'],['shop','依店家'],['cat','依分類'],['pay','依付款'],['person','依歸屬']];
  h+='<div class="viewseg" role="group" aria-label="檢視方式">'+V.map(([k,l])=>'<button type="button" data-mview="'+k+'" aria-pressed="'+(S.mview===k)+'">'+l+'</button>').join('')+'</div>';
  if(!m.ex.length){h+='<div class="empty">還沒有花費紀錄。按右下角「記一筆」，或在行程裡點店家記帳</div></div>';el.innerHTML=h;return}
  const ex=m.ex.slice().sort((a,b)=>((a.day||99)-(b.day||99))||((a.ts||0)-(b.ts||0)));
  const grp=(keyf,labelf,subf)=>{const g=new Map();ex.forEach(e=>{const k=keyf(e);if(!g.has(k))g.set(k,{k,rows:[],sum:0});const x=g.get(k);x.rows.push(e);x.sum+=+e.amount||0});
    return [...g.values()].map(x=>Object.assign(x,{label:labelf(x),sub:subf(x)}))};
  let groups,max=0;
  if(S.mview==='day')groups=grp(e=>e.day||0,x=>x.k?dayLabel(x.k):'出發前（機票、保險…）',x=>x.rows.length+' 筆'+(x.k&&(S.days.get('d'+x.k)||{}).title?'・'+S.days.get('d'+x.k).title:'')).sort((a,b)=>(a.k||99)-(b.k||99));
  else if(S.mview==='shop')groups=grp(e=>e.shop||'（未填店家）',x=>x.k,x=>x.rows.length+' 筆'+([...new Set(x.rows.map(e=>e.what).filter(Boolean))].join('、')?'・'+[...new Set(x.rows.map(e=>e.what).filter(Boolean))].join('、'):'')).sort((a,b)=>b.sum-a.sum);
  else if(S.mview==='cat'){groups=grp(e=>CAT_L[e.cat]?e.cat:'other',x=>CAT_L[x.k],x=>x.rows.length+' 筆・佔 '+(m.total?Math.round(x.sum/m.total*100):0)+'%').sort((a,b)=>b.sum-a.sum);max=groups.length?groups[0].sum:0}
  else if(S.mview==='pay')groups=grp(e=>PAY_L[e.pay]?e.pay:'cash',x=>PAY_L[x.k],x=>x.rows.length+' 筆・佔 '+(m.total?Math.round(x.sum/m.total*100):0)+'%').sort((a,b)=>b.sum-a.sum);
  else groups=grp(e=>e.split==='self'&&e.payer?e.payer:'💰旅遊基金',x=>x.k==='💰旅遊基金'?x.k:x.k+' 個人',x=>x.rows.length+' 筆').sort((a,b)=>b.sum-a.sum);
  h+=aggHTML(groups,rate,max)+'</div>';
  el.innerHTML=h;
  const inTrip=tn>=1&&tn<=NDAYS;
  el.querySelectorAll('details.agg').forEach((d,i)=>{d.dataset.k=S.mview+':'+groups[i].k;
    if(openKeys.includes(d.dataset.k))d.open=true;
    else if(!hadAny&&S.mview==='day'&&(inTrip?groups[i].k===tn:i===groups.length-1))d.open=true})}

/* ---------- writes ---------- */
function canWrite(){if(!S.canWrite){toast('你目前只能檢視，請行程擁有者把你設為可編輯');return false}return true}
function queue(key,fn){const p=(S.q[key]||Promise.resolve()).then(fn).catch(onWriteErr);S.q[key]=p;return p}
function onWriteErr(e){const c=e&&e.code;
  if(c==='invalid_argument'){S.canWrite=false;setSync('ro','只能檢視');render();toast('你目前只能檢視，改動沒有存到')}
  else if(c==='quota_exceeded')toast('資料已滿，請先刪掉一些項目');
  else if(c==='revoked'){S.canWrite=false;setSync('off','已中斷');render()}
  else toast('同步失敗，請稍後再試一次')}
const COLS={items:'items',lists:'lists',exps:'expenses'};
function ref(store,id){return S.db.collection(COLS[store]).doc(id)}
function patch(store,id,p,undoMsg){const it=S[store].get(id);if(!it||!canWrite())return;
  const prev={};for(const k in p)prev[k]=it[k]===undefined?null:it[k];
  S[store].set(id,Object.assign({},it,p));render();
  queue(store+id,()=>ref(store,id).update(p));
  if(undoMsg)toast(undoMsg,()=>patch(store,id,prev))}
function create(store,data){const r=S.db.collection(COLS[store]).doc();S[store].set(r.id,Object.assign({id:r.id},data));queue(store+r.id,()=>r.set(data));return r.id}
function remove(store,id,label){const it=S[store].get(id);if(!it||!canWrite())return;const data=Object.assign({},it);delete data.id;
  S[store].delete(id);render();queue(store+id,()=>ref(store,id).delete());
  toast('已刪除「'+label+'」',()=>{S[store].set(id,Object.assign({id},data));render();queue(store+id,()=>ref(store,id).set(data))})}
function moveItem(id,day,slot,order){const it=S.items.get(id);if(!it)return;

/* ---------- smart parse ---------- */
const KW_SLOT=[[/早午餐|早餐|breakfast/i,'breakfast'],[/午餐|中餐|午飯|lunch/i,'lunch'],[/晚餐|晚飯|dinner/i,'dinner'],[/宵夜|晚上|夜景/,'evening'],[/上午|早上/,'morning'],[/下午|下午茶/,'afternoon']];
const KW_KIND=[[/搭|機場|航班|JX\d|✈|新幹線|地鐵|電車|巴士|計程車|接機|出門|前往|轉車|Skyliner/i,'move'],[/check ?in|check ?out|入住|退房|飯店/i,'stay'],
  [/洗衣|採買|打包|訂位|換錢|領|買票|預約|記得/,'todo'],
  [/餐|吃|拉麵|燒肉|壽司|咖啡|cafe|café|coffee|pizza|漢堡|丼|咖哩|甜點|麵包|bread|bakery|食堂|居酒屋|牛排|豬排|鰻|蕎麥|烏龍|鬆餅|冰|酒/i,'food'],
  [/買|shop|store|商店|百貨|outlet|藥妝|唐吉|BEAMS|UNIQLO|GU|書店|玩具/i,'shop']];
const AREAS='原宿 表參道 澀谷 新宿 池袋 上野 淺草 淺草橋 藏前 押上 兩國 秋葉原 銀座 築地 東京車站 丸之內 日本橋 六本木 麻布台 麻布十番 神樂坂 中目黑 代官山 惠比壽 下北澤 吉祥寺 高円寺 自由之丘 品川 大井町 台場 舞濱 橫濱 鎌倉 江之島 福生 湯島 谷中 月島 豐洲 二子玉川 晴空塔'.split(' ');
function guessSlot(kind,hour){if(hour==null)return null;
  if(kind==='food')return hour<10?'breakfast':hour<15?'lunch':hour<17?'afternoon':'dinner';
  return hour<12?'morning':hour<18?'afternoon':'evening'}
function parseLine(line,def){let s=line.trim();if(!s)return null;const r={day:def.day,slot:null,kind:null,time:'',title:'',area:'',note:'',map:''};
  const um=s.match(/https?:\/\/\S+/);if(um){r.map=um[0];s=s.replace(um[0],' ');
    const pm=r.map.match(/\/maps\/place\/([^/@?]+)/);if(pm&&!s.trim()){try{s=decodeURIComponent(pm[1].replace(/\+/g,' '))}catch(e){}}}
  let m=s.match(/(?:^|\s)(?:day|d)\s*(\d{1,2})(?=\s|$)/i);if(m&&+m[1]>=1&&+m[1]<=NDAYS){r.day=+m[1];s=s.replace(m[0],' ')}
  else{m=s.match(new RegExp('(?:^|\\s)'+(START.getMonth()+1)+'\\s*[\\/月]\\s*(\\d{1,2})\\s*日?'));if(m){const n=+m[1]-START.getDate()+1;if(n>=1&&n<=NDAYS){r.day=n;s=s.replace(m[0],' ')}}}
  let hour=null;m=s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);if(m&&+m[1]<24){hour=+m[1];r.time=String(+m[1]).padStart(2,'0')+':'+m[2];s=s.replace(m[0],' ')}
  for(const [re,k] of KW_SLOT){const mm=s.match(re);if(mm){r.slot=k;if(/^(早午餐|早餐|午餐|中餐|晚餐|上午|下午|晚上|早上|宵夜)$/.test(mm[0]))s=s.replace(mm[0],' ');break}}
  for(const [re,k] of KW_KIND)if(re.test(s+' '+line)){r.kind=k;break}
  if(!r.kind)r.kind=r.slot&&/breakfast|lunch|dinner/.test(r.slot)?'food':'spot';
  s=s.split(/\s+/).filter(w=>{if(!r.area&&AREAS.includes(w)){r.area=w;return false}return true}).join(' ');
  r.title=s.replace(/\s+/g,' ').replace(/^[\s,，、|｜\-–—]+|[\s,，、|｜\-–—]+$/g,'').trim();
  if(!r.title)r.title=r.map?'新地點（點進去改名）':'';
  if(!r.title)return null;
  if(r.day===0)r.slot='pool';
  else if(!r.slot)r.slot=guessSlot(r.kind,hour)||(def.slot&&def.slot!=='pool'?def.slot:(r.kind==='food'?'lunch':'afternoon'));
  return r}

function daySeg(sel,withPool,poolLabel){let h='<div class="seg dstrip" id="seg-day">';for(let n=withPool?0:1;n<=NDAYS;n++){const d=n?dayDate(n):null,wd=d&&d.getDay();

function photosHTML(ids,ro){return '<div class="photos" id="photos">'+(ids||[]).map(id=>'<span class="ph-t" data-pid="'+esc(id)+'"><img src="'+esc(photoSrc(id))+'" alt="照片">'+(ro?'':'<button type="button" class="ph-rm" aria-label="移除照片">×</button>')+'</span>').join('')+
  (!ro&&S.assets?'<label class="ph-add">＋<br>加照片<input type="file" accept="image/*" multiple id="ph-file"></label>':'')+'</div>'}
function compress(file){return new Promise(res=>{if(!/^image\//.test(file.type)||file.type==='image/gif'||file.type==='image/svg+xml'){res(file);return}
  const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const M=1440,s=Math.min(1,M/Math.max(img.width,img.height));
    if(s===1&&file.size<4e5){URL.revokeObjectURL(url);res(file);return}
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(url);res(b&&b.size<file.size?b:file)},'image/jpeg',.8)};img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}
function bindPhotos(root,getIds,setIds){const box=root.querySelector('#photos');if(!box)return;
  box.addEventListener('click',e=>{const rm=e.target.closest('.ph-rm');
    if(rm){e.preventDefault();const t=rm.closest('.ph-t'),pid=t.dataset.pid;
      if(!rm.classList.contains('arm')){rm.classList.add('arm');rm.textContent='確定刪除';setTimeout(()=>{if(rm.isConnected){rm.classList.remove('arm');rm.textContent='×'}},3000);return}
      setIds(getIds().filter(x=>x!==pid));t.remove();if(S.assets)S.assets.delete(pid).catch(()=>{});toast('照片已刪除');return}
    const im=e.target.closest('.ph-t img');if(im)lightbox(im.src)});
  const inp=box.querySelector('#ph-file');if(!inp)return;
  inp.addEventListener('change',async()=>{const files=[...inp.files];inp.value='';if(!files.length)return;
    for(const f of files){const busy=document.createElement('span');busy.className='ph-busy';busy.textContent='上傳中…';box.insertBefore(busy,box.querySelector('.ph-add'));
      try{const blob=await compress(f);const r=await S.assets.upload(blob,{contentType:blob.type||f.type});S.assetUrl[r.id]=r.url;
        setIds(getIds().concat(r.id));const t=document.createElement('span');t.className='ph-t';t.dataset.pid=r.id;t.innerHTML='<img alt="照片"><button type="button" class="ph-rm" aria-label="移除照片">×</button>';t.querySelector('img').src=photoSrc(r.id);busy.replaceWith(t)}
      catch(e){busy.remove();const c=e&&e.code;toast(c==='quota_exceeded'?'空間滿了，先刪掉幾張照片':c==='not_granted'?'你沒有上傳權限':'照片上傳失敗，請再試一次')}}})}

function startDrag(e,grip){if(!S.canWrite){toast('你目前只能檢視，不能移動');return}

  const ph=document.createElement('div');ph.className='ph';ph.style.height=r.height+'px';

  S.drag={id:el.dataset.id,el,ghost,ph,grip,pid:e.pointerId,list0:el.parentNode,prev0:op&&op.dataset.id,next0:on&&on.dataset.id,

  if(chip){if(d.chip!==chip){if(d.chip)d.chip.classList.remove('drop');d.chip=chip;chip.classList.add('drop');clearTimeout(d.chipT);
      d.chipT=setTimeout(()=>{if(S.drag&&S.drag.chip===chip){setActive(+chip.dataset.day,{noScroll:true})}},500)}return}
  if(d.chip){d.chip.classList.remove('drop');d.chip=null;clearTimeout(d.chipT)}
  const list=t.closest('.list');if(!list)return;
  const its=[...list.querySelectorAll('.item:not(.src)')];let before=null;
  for(const it of its){const rr=it.getBoundingClientRect();if(d.y<rr.top+rr.height/2){before=it;break}}
  if(before){if(d.ph.nextElementSibling!==before||d.ph.parentNode!==list)list.insertBefore(d.ph,before)}
  else if(d.ph.parentNode!==list||sibItem(d.ph,1))list.appendChild(d.ph)}
function autoScroll(){const d=S.drag;if(!d)return;let moved=false;
  const sb=$('.bar-wrap').getBoundingClientRect().bottom,H=innerHeight;
  if(d.y>sb&&d.y<sb+56&&scrollY>0){scrollBy(0,-12);moved=true}else if(d.y>H-72){scrollBy(0,12);moved=true}
  const st=$('#strip'),str=st.getBoundingClientRect();
  if(d.y>=str.top&&d.y<=str.bottom){if(d.x<str.left+48&&st.scrollLeft>0){st.scrollLeft-=10;moved=true}else if(d.x>str.right-48&&st.scrollLeft<st.scrollWidth-st.clientWidth){st.scrollLeft+=10;moved=true}}

    if(d.x<br.left+64&&b.scrollLeft>0){b.scrollLeft-=16;moved=true}else if(d.x>br.right-64&&b.scrollLeft<b.scrollWidth-b.clientWidth){b.scrollLeft+=16;moved=true}}

function onDragUp(e){if(S.drag&&e.pointerId===S.drag.pid)endDrag(false)}
function onDragCancel(e){if(S.drag&&e.pointerId===S.drag.pid)endDrag(true)}
function sibItem(el,dir){let s=dir<0?el.previousElementSibling:el.nextElementSibling;while(s&&(!s.classList.contains('item')||s.classList.contains('src')))s=dir<0?s.previousElementSibling:s.nextElementSibling;return s}
function endDrag(cancel){const d=S.drag;if(!d)return;

    else if(d.ph.parentNode&&d.ph.parentNode.classList.contains('list')){const list=d.ph.parentNode,day=+list.dataset.day,slot=list.dataset.slot;
      const p=sibItem(d.ph,-1),n=sibItem(d.ph,1);

      if(!same){const pi=p&&S.items.get(p.dataset.id),ni=n&&S.items.get(n.dataset.id);const po=pi?pi.order:null,no=ni?ni.order:null;

/* ---------- site extras: daily weather, live exchange rate, "how to get there" (runs inside __bootTrip) ---------- */
const XLS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* weather: Open-Meteo (free, no key). Within 16 days of today → forecast; otherwise → same dates last year as a hint. */
const WXI=c=>c===0?['☀️','晴']:c<=2?['🌤️','晴時多雲']:c===3?['☁️','陰']:c<=48?['🌫️','霧']:c<=57?['🌦️','毛毛雨']:c<=67?['🌧️','雨']:c<=77?['🌨️','雪']:c<=82?['🌧️','陣雨']:c<=86?['🌨️','陣雪']:['⛈️','雷雨'];
const WX={days:{},kind:''};
function wxChip(n){const w=WX.days[ymd(dayDate(n))];if(!w)return '';const [ic,lb]=WXI(w.c),past=w.kind==='past';
  return '<span class="wx'+(past?' wx-past':'')+'" title="'+(past?'去年同一天的天氣，僅供參考':'天氣預報')+'">'+(past?'<small>去年</small>':'')+'<i aria-hidden="true">'+ic+'</i>'+lb+' '+Math.round(w.hi)+'°/'+Math.round(w.lo)+'°'+(w.p!=null&&!past?' <small>☂'+w.p+'%</small>':'')+'</span>'}
async function loadWeather(){
  if(!T.dest&&!(T.lat&&T.lon))return;
  const key=T.id+'-wx2',c=XLS.get(key);if(c&&Date.now()-c.at<3*36e5){Object.assign(WX,c.wx);render();return}
  try{
    let lat=T.lat,lon=T.lon;
    if(!(lat&&lon)){const g=XLS.get(T.id+'-geo');if(g&&g.q===T.dest){lat=g.lat;lon=g.lon}else{
      const r=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name='+encodeURIComponent(T.dest))).json();
      const p=r.results&&r.results[0];if(!p)return;lat=p.latitude;lon=p.longitude;XLS.set(T.id+'-geo',{q:T.dest,lat,lon})}}
    const first=dayDate(1),last=dayDate(NDAYS),t0=now();t0.setHours(0,0,0,0);const lim=new Date(t0);lim.setDate(lim.getDate()+15);
    if(last<t0)return;
    const q='latitude='+lat+'&longitude='+lon+'&timezone=auto&daily=weather_code,temperature_2m_max,temperature_2m_min';
    const days={},put=(d,shift,kind)=>{if(!d||!d.time)return;d.time.forEach((t,i)=>{if(d.temperature_2m_max[i]==null)return;let k=t;if(shift){const x=new Date(t+'T00:00:00');x.setFullYear(x.getFullYear()+1);k=ymd(x)}
      days[k]={c:d.weather_code[i],hi:d.temperature_2m_max[i],lo:d.temperature_2m_min[i],p:d.precipitation_probability_max?d.precipitation_probability_max[i]:null,kind}})};
    // last year's same dates for every day (a hint), then the real forecast on top for days within 16 days
    {const a=new Date(first),b=new Date(last);a.setFullYear(a.getFullYear()-1);b.setFullYear(b.getFullYear()-1);
      try{put((await (await fetch('https://archive-api.open-meteo.com/v1/archive?'+q+'&start_date='+ymd(a)+'&end_date='+ymd(b))).json()).daily,1,'past')}catch(e){}}
    if(first<=lim){const s0=first<t0?t0:first,e0=last<lim?last:lim;
      try{put((await (await fetch('https://api.open-meteo.com/v1/forecast?'+q+',precipitation_probability_max&start_date='+ymd(s0)+'&end_date='+ymd(e0))).json()).daily,0,'fc')}catch(e){}}
    WX.days=days;XLS.set(key,{at:Date.now(),wx:{days}});render();
  }catch(e){}
}

/* exchange rate: open.er-api.com (free, no key), refreshed at most every 6 hours. Manual rate wins when the trip turned auto off. */
const FX={rate:0,at:''};
function applyFx(){if(S.meta.rateAuto!==false&&FX.rate){S.meta.rate=FX.rate}}
async function loadFx(){
  const c=XLS.get('fx-JPY-TWD');if(c&&Date.now()-c.got<6*36e5){Object.assign(FX,c);applyFx();render();return}
  try{const r=await (await fetch('https://open.er-api.com/v6/latest/JPY')).json();const v=r&&r.rates&&r.rates.TWD;if(!(v>0))return;
    FX.rate=Math.round(v*10000)/10000;FX.at=new Date(r.time_last_update_unix*1000).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});
    XLS.set('fx-JPY-TWD',{rate:FX.rate,at:FX.at,got:Date.now()});applyFx();render()}catch(e){}
}

/* how to get there: link from each place to the next place of the same day (Google Maps transit directions) */
let NEXT={},FIRST=new Set();
// a stop needs a real location (area / map search / map link); things like 飛機餐 don't
const isStop=i=>PLACE_KINDS.includes(i.kind)&&!!(i.area||i.q||safeUrl(i.map))&&!!placeQuery(i);
const HOTEL=()=>T.hotel?(T.hotel.q||T.hotel.name||''):'';
const transit=(a,b)=>'https://www.google.com/maps/dir/?api=1&travelmode=transit&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b);
function buildNext(){NEXT={};FIRST=new Set();for(let n=1;n<=NDAYS;n++){const ps=dayItems(n).filter(isStop);if(ps[0]&&n>1&&HOTEL())FIRST.add(ps[0].id);for(let i=0;i<ps.length-1;i++)NEXT[ps[i].id]=ps[i+1]}}
function goNext(it){let h='';
  if(FIRST.has(it.id))h+='<a class="gonext" href="'+esc(transit(HOTEL(),placeQuery(it)))+'" target="_blank" rel="noopener">🚃 從飯店過來</a>';
  const nx=NEXT[it.id];if(nx)h+='<a class="gonext" href="'+esc(transit(placeQuery(it),placeQuery(nx)))+'" target="_blank" rel="noopener" aria-label="怎麼去下一站：'+esc(nx.title)+'">🚃 下一站怎麼去</a>';
  return h?'<span class="gorow">'+h+'</span>':''}
/* today's route starts from the hotel (Google Maps can't do transit with several stops, so this one is the overview) */
function routeUrlH(n){const ps=dayItems(n).filter(isStop).map(placeQuery).filter(Boolean);
  const seen=new Set(),u=ps.filter(p=>!seen.has(p)&&seen.add(p)).slice(0,9);if(!u.length)return '';
  const all=(n>1&&HOTEL()?[HOTEL()]:[]).concat(u);if(all.length===1)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(all[0]);
  return 'https://www.google.com/maps/dir/'+all.map(encodeURIComponent).join('/')}
/* 今日路線: a sheet with every leg of the day as a one-tap transit route, plus the whole-day overview */
function openRoute(n){
  const ps=dayItems(n).filter(isStop),seen=new Set(),stops=ps.filter(i=>{const q=placeQuery(i);return !seen.has(q)&&seen.add(q)});
  const H=n>1&&n<NDAYS+1&&HOTEL()?{title:'飯店',q:HOTEL()}:null,pts=stops.map(i=>({title:i.title,q:placeQuery(i)}));
  const legs=[];const seq=(H?[H]:[]).concat(pts).concat(H&&n<NDAYS?[{title:'回飯店',q:H.q}]:[]);
  for(let i=0;i<seq.length-1;i++)legs.push([seq[i],seq[i+1]]);
  const row=(a,b)=>'<a class="leg" href="'+esc(transit(a.q,b.q))+'" target="_blank" rel="noopener"><span class="leg-i">🚃</span><span class="leg-t"><b>'+esc(a.title)+'</b><span class="leg-a">→</span><b>'+esc(b.title)+'</b></span><span class="leg-go">路線</span></a>';
  openSheet('<h2>Day '+n+' 怎麼走</h2><p class="hint2">每一段點下去會打開 Google 地圖的電車路線。</p>'+
    (legs.length?'<div class="legs">'+legs.map(([a,b])=>row(a,b)).join('')+'</div>':'<div class="empty">這天還沒有地點</div>')+
    (routeUrlH(n)?'<a class="btn block leg-all" href="'+esc(routeUrlH(n))+'" target="_blank" rel="noopener">🗺️ 看整天全貌（多點地圖）</a>':''))}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a.route[data-rd]');if(!a)return;e.preventDefault();e.stopPropagation();openRoute(+a.dataset.rd)},true);

    ()=>{setSync('off','已中斷');notice('<b>同步中斷了</b>重新整理頁面就會再連上。')});

    if (error) {
      if (tripId && localStorage.getItem('trip-meta-' + tripId)) return 'offline';
      gate('<div class="gate-card">' + art('travel') + '<h1>連不上網路</h1><p>' + (tripId ? '這台裝置還沒存過這趟旅行，' : '') + '請確認網路後再試一次。</p><button type="button" class="btn pri block" onclick="location.reload()">重新整理</button></div>');

      gate('<div class="gate-card">' + art('travel') + '<h1>還沒有被邀請</h1><p>' + esc(session.user.email) + ' 目前沒有被分享任何旅行，請請手帳主人邀請你。</p><button type="button" class="btn block" data-logout>換帳號登入</button></div>');

          const sd = e.target.closest('[data-send]'); if (sd) { copyInvite(); return; }
          const rm = e.target.closest('[data-rm]');
          if (rm) { if (!rm.classList.contains('arm')) { rm.classList.add('arm'); rm.textContent = '確定'; return; } await sb.from('trip_shares').delete().eq('trip_id', TRIP.id).eq('email', rm.dataset.rm); ptoast('已移除'); draw(root); return; }
          const b = e.target.closest('.shrole button'); if (b) { const em = b.parentNode.dataset.email; await sb.from('trip_shares').update({ role: b.dataset.v }).eq('trip_id', TRIP.id).eq('email', em); ptoast('已更新權限'); draw(root); }
        });
        draw(root);
      });
  }

  function inviteText() {
    const url = location.origin + location.pathname + '?t=' + encodeURIComponent(TRIP.id);
    return ['邀請你一起看「' + TRIP.title + '」旅行手帳 ✈️', url, '', '打開後按「用 Google 登入」，選被邀請的這個 Gmail 就能進去。', '手機可以「加入主畫面」，之後像 App 一樣點開，沒網路也能看行程。'].join('\n');
  }
  async function copyInvite() {
    const t = inviteText();
    if (navigator.share && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({ text: t }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(t); ptoast('已複製邀請訊息，貼到 LINE 就好'); }
    catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); ptoast('已複製邀請訊息，貼到 LINE 就好'); }
  }
  function showInvite(root, em) {
    const box = root.querySelector('#sh-inv'); box.hidden = false; const h2 = root.querySelector('#sh-hint2'); if (h2) h2.hidden = true;
    box.innerHTML = '<b>✓ 已加入 <span></span></b><small>最後一步：把邀請訊息傳給對方（LINE 之類），他用這個 Gmail 登入就看得到。</small><button type="button" class="btn pri">傳邀請訊息</button>';
    box.querySelector('span').textContent = em;
    box.querySelector('button').onclick = copyInvite;
  }

  /* ---------- trip hero (built from the trip settings) ---------- */
  // which flight the ticket shows: 出發前 and day 1 → the flight out; from day 2 on → the flight home
  function showBack(T, day) { return day >= 2; }
  function hero(T, day) {
    const end = addDays(T.start, T.days - 1), h = T.hotel || {};
    const o0 = T.out || {}, b0 = T.back || {}, back = showBack(T, day == null ? Math.max(1, Math.round((today0() - new Date(T.start + 'T00:00:00')) / 864e5) + 1) : day);
    const o = back && (b0.no || b0.fromCode) ? b0 : o0, b = o === b0 ? o0 : b0, oDate = o === b0 ? end : T.start, bDate = o === b0 ? T.start : end, bLabel = o === b0 ? '去程 ' : '回程 ';
    const plane = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
    const hasFly = o.no || o.fromCode || o.toCode;
    return '<div class="hero-top"><div class="brand"><h1>' + esc(T.title) + '</h1><span class="sub">' + esc(T.dest || '') + ' ' + T.days + ' 天' + (T.days > 1 ? ' ' + (T.days - 1) + ' 夜' : '') + '</span></div>' +
      '<span class="sync" id="sync" data-s="wait"><i></i><span id="sync-t">連線中</span></span></div>' +
      '<div class="hero-art">' + art(T.theme) + '</div>' +
      '<div class="pass"><div class="pass-main">' +
      (hasFly ? '<div class="fly-row"><div class="ap"><b>' + esc(o.fromCode || '出發') + '</b><span>' + esc(o.from || '') + '</span></div><div class="fly"><span class="fn">' + esc(o.no || '') + '</span><span class="fline">' + plane + '</span><span class="ft">' + fmtDate(oDate) + (o.dep ? o.dep + (o.arr ? ' → ' + o.arr : '') : '') + '</span></div><div class="ap r"><b>' + esc(o.toCode || '抵達') + '</b><span>' + esc(o.to || '') + '</span></div></div>' +
        '<div class="ft-row">' + fmtDate(oDate) + ' ' + (o.dep ? o.dep + (o.arr ? ' → ' + o.arr : '') : '') + '</div>'
        : '<div class="fly-row"><div class="ap"><b>' + fmtDate(T.start) + '</b><span>出發</span></div><div class="fly"><span class="fline">' + plane + '</span></div><div class="ap r"><b>' + fmtDate(end) + '</b><span>回程</span></div></div>') +
      ((b.no || h.name) ? '<div class="pass-meta">' + (b.no ? '<div><span>' + bLabel + fmtDate(bDate) + '</span><b>' + esc(b.no) + '</b><small class="nb">' + esc([b.dep, b.arr].filter(Boolean).join(' → ')) + '</small></div>' : '<div></div>') +
        (h.name ? '<div><span>住宿 ' + (T.days - 1) + ' 晚</span><b>' + (h.map ? '<a class="hotel-l" href="' + esc(h.map) + '" target="_blank" rel="noopener">' + esc(h.name) + ' 📍</a>' : esc(h.name)) + '</b><small class="nb">' + esc(h.note || '') + '</small></div>' : '') + '</div>' : '') +
      (h.name ? (h.map ? '<a class="hotel-m" href="' + esc(h.map) + '" target="_blank" rel="noopener">' : '<div class="hotel-m">') + '<span>🏨</span><b>' + esc(h.name) + '</b>' + (h.map ? '<em>地圖</em></a>' : '</div>') : '') +
      '</div><div class="pass-stub"><span id="cd-l">出發倒數</span><b id="cd">–</b><span id="cd-u">天</span></div></div>';
  }

  /* ---------- db adapter (collection/doc API over docs table, scoped to one trip) ---------- */
  const cache = new Map(), colSubs = new Map(), docSubs = new Map(), loaded = new Map();
  const mapOf = c => { if (!cache.has(c)) cache.set(c, new Map()); return cache.get(c); };
  const qsnap = c => { const docs = [...mapOf(c).entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([id, v]) => ({ id, exists: true, data: () => clone(v), metadata: { fromCache: false, hasPendingWrites: false } })); return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] }; };
  const dsnap = (c, id) => { const v = mapOf(c).get(id); return { id, exists: !!v, data: () => v && clone(v), metadata: { fromCache: false, hasPendingWrites: false } }; };
  function emit(c, id) { (colSubs.get(c) || []).forEach(fn => { try { fn(qsnap(c)); } catch (e) { console.error(e); } }); if (id != null) (docSubs.get(c + '/' + id) || []).forEach(fn => { try { fn(dsnap(c, id)); } catch (e) { console.error(e); } }); }
  function load(c) { if (!loaded.has(c)) loaded.set(c, (async () => { const { data, error } = await sb.from('docs').select('id,data').eq('trip_id', TRIP.id).eq('col', c); if (error) throw err('unavailable', error.message); const m = mapOf(c); m.clear(); for (const r of data) m.set(r.id, r.data); })()); return loaded.get(c); }
  let rt = null;
  function realtime() {
    if (rt) return;
    rt = sb.channel('docs-' + TRIP.id).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'trip_id=eq.' + TRIP.id }, p => {
      const row = p.eventType === 'DELETE' ? p.old : p.new; if (!row || !row.col || (row.trip_id && row.trip_id !== TRIP.id)) return;
      if (p.eventType === 'DELETE') mapOf(row.col).delete(row.id); else mapOf(row.col).set(row.id, row.data); emit(row.col, row.id);
    }).subscribe(st => { if (st === 'SUBSCRIBED') for (const c of colSubs.keys()) { loaded.delete(c); load(c).then(() => emit(c)).catch(() => {}); } });
  }
  async function write(fn) { const { error } = await fn(); if (error) throw err(/permission|policy|rls|42501/i.test(error.message + error.code) ? 'invalid_argument' : 'unavailable', error.message); }
  function docRef(c, id) {
    return { id, path: c + '/' + id,
      async get() { await load(c); return dsnap(c, id); },
      async set(data) { const v = clone(data); mapOf(c).set(id, v); emit(c, id); await write(() => sb.from('docs').upsert({ trip_id: TRIP.id, col: c, id, data: v, updated_at: new Date().toISOString() })); },
      async update(patch) { await load(c); const cur = mapOf(c).get(id); if (!cur) throw err('invalid_argument', 'missing'); const v = Object.assign({}, cur, clone(patch)); mapOf(c).set(id, v); emit(c, id); await write(() => sb.from('docs').update({ data: v, updated_at: new Date().toISOString() }).eq('trip_id', TRIP.id).eq('col', c).eq('id', id)); },
      async delete() { mapOf(c).delete(id); emit(c, id); await write(() => sb.from('docs').delete().eq('trip_id', TRIP.id).eq('col', c).eq('id', id)); },
      onSnapshot(next, onErr) { const k = c + '/' + id; if (!docSubs.has(k)) docSubs.set(k, new Set()); docSubs.get(k).add(next); if (!colSubs.has(c)) colSubs.set(c, new Set()); realtime(); load(c).then(() => next(dsnap(c, id))).catch(e => onErr && onErr(e)); return () => docSubs.get(k).delete(next); } };
  }
  const db = { collection(c) { return { path: c, doc(id) { return docRef(c, id || rid()); }, async add(d) { const r = docRef(c, rid()); await r.set(d); return r; }, onSnapshot(next, onErr) { if (!colSubs.has(c)) colSubs.set(c, new Set()); colSubs.get(c).add(next); realtime(); load(c).then(() => next(qsnap(c))).catch(e => onErr && onErr(e)); return () => colSubs.get(c).delete(next); } }; }, doc(p) { const [c, i] = p.split('/'); return docRef(c, i); } };

  const names = {}, nameOf = u => (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || (u.email || '').split('@')[0];
  const user = { async can() { return role === 'edit'; }, async canEdit() { return role === 'edit'; }, async isOwner() { return access.admin; }, async id() { return session && session.user.id; }, async me() { return { id: session.user.id, name: nameOf(session.user), email: session.user.email }; }, async profiles(ids) { const o = {}; ids.forEach(i => { o[i] = Object.assign({ id: i, name: '', color: '' }, names[i] || {}); }); return o; } };
  let ch = null, myState = {};
  const room = { async presence(p) { myState = Object.assign({}, myState, p, { name: nameOf(session.user) }); if (ch) await ch.track(myState); },
    onPeers(fn) { ch = sb.channel('room-' + TRIP.id, { config: { presence: { key: session.user.id } } }); ch.on('presence', { event: 'sync' }, () => { const st = ch.presenceState(), peers = []; for (const k of Object.keys(st)) { const p = st[k][0] || {}; names[k] = { name: p.name || '', color: '' }; peers.push({ peer: k, by: k, isMe: k === session.user.id, sameTab: k === session.user.id, kind: 'viewer', guest: false, presence: p, updatedAt: Date.now() }); } fn({ peers, joined: [], left: [], updated: [] }); }).subscribe(s => { if (s === 'SUBSCRIBED') ch.track(myState); }); return () => sb.removeChannel(ch); } };
  const urls = {}, pending = new Set(); let waiters = [];
  window.__photoUrl = (id, onReady) => { if (urls[id]) return urls[id]; if (onReady) waiters.push(onReady); if (!pending.has(id)) { pending.add(id); queueMicrotask(async () => { const ids = [...pending]; pending.clear(); const { data } = await sb.storage.from('photos').createSignedUrls(ids, 604800); (data || []).forEach(r => { if (r.signedUrl) urls[r.path] = r.signedUrl; }); const w = waiters; waiters = []; w.forEach(f => f()); }); } return 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; };
  const assets = { async upload(blob, opts) { const type = (opts && opts.contentType) || blob.type || 'image/jpeg', ext = (type.split('/')[1] || 'jpg').replace('jpeg', 'jpg'), path = TRIP.id + '/' + rid() + '.' + ext; const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: type, upsert: false }); if (error) throw err(/quota|size/i.test(error.message) ? 'quota_exceeded' : 'unavailable', error.message); const { data } = await sb.storage.from('photos').createSignedUrl(path, 604800); urls[path] = data && data.signedUrl; return { id: path, url: urls[path], sizeBytes: blob.size, contentType: type }; }, async delete(id) { await sb.storage.from('photos').remove([id]); } };

  /* ---------- AI descriptions (Edge Function "describe" → Gemini; key stays server-side) ---------- */
  async function sample(input, opts) {
    opts = opts || {};
    const prompt = typeof input === 'string' ? input : (input[input.length - 1] || {}).content || '';
    const call = sb.functions.invoke('describe', { body: { trip: TRIP.id, prompt } });
    const aborted = new Promise((_, rej) => { if (opts.signal) opts.signal.addEventListener('abort', () => rej(Object.assign(new Error('aborted'), { name: 'AbortError', code: 'aborted' })), { once: true }); });
    const { data, error } = await Promise.race([call, aborted]);
    if (error || !data || !data.text) {
      let code = (data && data.code) || 'unavailable';
      try { const b = error && error.context && await error.context.json(); if (b && b.code) code = b.code; } catch (e) {}
      throw err(code, (error && error.message) || code);
    }
    if (opts.onText) opts.onText({ text: data.text, delta: data.text });
    return { text: data.text, truncated: false };
  }

  /* ---------- boot ---------- */
  (async () => {
    const st = await signIn();
    if (!tripId) { if (st === 'ok') { document.body.classList.remove('gated'); await shelf(); } return; }
    // trip page
    let ok = st === 'ok', data = null, ferr = null;
    if (ok) {
      try { const r = await sb.from('trips').select('id,data').eq('id', tripId).maybeSingle(); data = r.data; ferr = r.error; } catch (e) { ferr = e; }
      if (ferr && localStorage.getItem('trip-meta-' + tripId)) { ok = false; }
      else if (!data) { gate('<div class="gate-card">' + art('travel') + '<h1>找不到這趟旅行</h1><p>可能已被刪除，或還沒有分享給你。</p><a class="btn pri block" href="' + location.pathname + '">回我的旅行</a></div>'); return; }
    }
    if (ok) {
      TRIP = Object.assign({ id: data.id }, data.data);
      if (access.admin) role = 'edit'; else { const { data: sh } = await sb.from('trip_shares').select('role').eq('trip_id', tripId).eq('email', (session.user.email || '').toLowerCase()).maybeSingle(); role = sh && sh.role === 'edit' ? 'edit' : 'view'; }
      try { localStorage.setItem('trip-meta-' + tripId, JSON.stringify(TRIP)); } catch (e) {}
    }
    if (!ok && (st === 'offline' || st === 'ok')) {
      try { TRIP = JSON.parse(localStorage.getItem('trip-meta-' + tripId) || 'null'); } catch (e) {}
      if (!TRIP) { gate('<div class="gate-card"><h1>目前離線</h1><p>這台裝置還沒有存過這趟旅行，連上網路後再打開。</p></div>'); return; }
    }
    if (!TRIP) return;
    document.body.classList.remove('gated'); $('#app').hidden = false;
    document.title = TRIP.title + '｜旅行手帳';
    $('#trip-hero').innerHTML = hero(TRIP);
    const bar = $('.bar'); if (bar) {
      const back = document.createElement('a'); back.className = 'backlink'; back.href = location.pathname; back.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>我的旅行</span>'; back.setAttribute('aria-label', '回我的旅行'); bar.insertBefore(back, bar.firstChild);
      if (ok && access.admin) {
        const s = document.createElement('button'); s.type = 'button'; s.className = 'icon-btn pill-btn'; s.textContent = '分享'; s.onclick = shareSheet; bar.appendChild(s);
        const g = document.createElement('button'); g.type = 'button'; g.className = 'icon-btn'; g.setAttribute('aria-label', '旅行設定'); g.textContent = '⚙'; g.onclick = () => tripForm(TRIP); bar.appendChild(g);
      }
    }
    window.claude = { use: async name => ok ? ({ db, user, room, assets, sample: role === 'edit' ? sample : null }[name] || null) : null };
    window.__bootTrip(TRIP);
    // the ticket follows the day you're looking at: tap the last day → the flight home
    let lastBack = null;
    window.__onDay = n => { if (window.__fabSync) window.__fabSync(); const back = showBack(TRIP, n); if (back === lastBack) return; lastBack = back;
      const tmp = document.createElement('div'); tmp.innerHTML = hero(TRIP, n);
      const cur = $('#trip-hero .pass-main'), nw = tmp.querySelector('.pass-main'); if (cur && nw) cur.replaceWith(nw); };
    { const ac = document.querySelector('.chip.active'); if (ac) window.__onDay(+ac.dataset.day); }
    footer();
  })();
})();

if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
